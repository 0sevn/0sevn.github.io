<style>

.status-hud { 
display: flex; 
width: 100%;
align-items: center; 
text-align: left; 
gap: 8px; 
vertical-align: middle; 
border: 1px solid #818181;
}

.status-dot { 
    width: 8px; 
    height: 8px; 
    border-radius: 50%; 
    
    display: inline-block;
    transition: transform 0.9s ease; 
    
}
@keyframes active-anim {
    0% { scale: 1; box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); border-color: rgba(255, 215, 0, 0.3); }
    50% { scale: 1,5; box-shadow: 0 0 30px rgba(255, 215, 0, 0.6); border-color: rgba(255, 215, 0, 0.8); }
    100% { scale: 0,5; box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); border-color: rgba(255, 215, 0, 0.3); }
}

.active {
    background: green; 
    animation: active-anim 2s infinite ease-in-out;
}


.inactive {
    background: red; 
}


.status-text { 
    font-size: 10px; text-transform: uppercase; font-weight: bold; color: var(--text-color); opacity: 0.7; 
    align-items: right; text-align: right; right:0px;
}
</style>

const items = Array.from(document.querySelectorAll('.project-item')).reverse(); // Reverse to start with last item
console.log('array',items.length);
let currentIndex = 0;

function showNextItem() {
	if (currentIndex < items.length) {
		const currentItem = items[currentIndex];
		currentItem.classList.add('visible'); // Make the item visible

		// Shift all previously visible items down
		for (let i = 0; i < currentIndex; i++) {
			items[i].style.transform = `translateY(${(currentIndex - i) * 220}px)`; // Adjust based on your item height
		}

		currentIndex++; // Move to the next item
console.log('Animation ended:',currentIndex);
		// Schedule the next item to appear
		setTimeout(showNextItem, 1000); // Adjust delay as needed
	}
}
