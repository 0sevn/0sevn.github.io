  body {
    margin: 0;
    height: 600vh;
    background: #000;
    overflow-x: hidden;
    font-family: system-ui, sans-serif;
  }

  .scene {
    position: fixed;
    inset: 0;
    perspective: 1200px;
    overflow: hidden;
  }

  .spiral {
    position: absolute;
    top: 40%;
    left: 0%;
    transform-style: preserve-3d;
  }

.item {
  all: unset;              /* reset button defaults */
  position: absolute;
  width: 400px;
  height: 240px;
  padding: 10px;
  margin: -120px;
  background: rgba(255,255,255,0.05);
  border-radius: 8px;
  color: white;
  font-size: 14px;
  letter-spacing: 0.3px;
  will-change: transform, opacity;
  cursor: pointer;
}

 background: rgba(48, 45, 45, 0.61);
 /* outline:auto */
 border: 1px solid #000;
}
.item:focus {

}

  .title {
    font-size: 16px;
    margin-bottom: 8px;
  }

  .description {
    font-size: 13px;
    opacity: 0.7;
    margin-bottom: 12px;
  }

  .meta {
    font-size: 12px;
    opacity: 0.5;
    display: flex;
    justify-content: space-between;
  }
  img {
  width: 100%;
  height:180px;
  /* height: 140px; */
  object-fit: cover;
  margin-bottom: 10px;
  border-radius: 4px;
}
.popover {
  width: 420px;
  max-width: 90%;
  padding: 30px;
  border-radius: 12px;
  border: none;
  background: #111;
  color: white;
}

.popover::backdrop {
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
}

.close {
  position: absolute;
  top: 15px;
  right: 20px;
  background: none;
  border: none;
  color: white;
  font-size: 22px;
  cursor: pointer;
}

</style>

const spiral = document.getElementById("spiral");

let items = [];
let targetScroll = 0;
let currentScroll = 0;

/* ---------------------------
   CREATE ITEMS
---------------------------- */
const popoverContent = document.getElementById("popoverContent");
posts.forEach((post) => {
  const content = document.createElement("button");
  content.className = "item";

  content.innerHTML = `
    <img src="movies/${post.title}.jpg" />
    <div class="title">${post.title}</div>
  `;

  content.setAttribute("popovertarget", "postPopover");
  content.setAttribute("popovertargetaction", "show");

content.addEventListener("click", () => {
  popoverContent.innerHTML = `
    <h2 style="margin-top:0">${post.title}</h2>
      <img src="movies/${post.title}.jpg" style="width:100%; border-radius:8px;" onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'"/>
      <p style="line-height:1.6; font-size:1.1rem;">${post.description}</p>
      <hr style="border:0; border-top:1px solid #333; margin:20px 0;">
      <div style="opacity:0.6;">
        Category: ${post.category} <br> 
        Logged on: ${post.date}
      </div>
    `;
});
  spiral.appendChild(content);
  items.push(content);
});








/* ---------------------------
   ANIMATION
---------------------------- */
const total = posts.length;
// depth distance
// 240 more to the left
// 640 more central but out of bounds on smaller screen
// need display adaptive units
const radius = 440;

// spiral width
// 280 good balance on small screen
// 880, star wars fade out scroll, passing through each movie
// immersive
const spacing = 280;

 // curvature
//  full spiral effect
const angleStep = 0.5;

const totalDepth = total * spacing;
// Set page height based on content
// set based on screen size
document.body.style.height = (total * 500) + "px";

function animate() {
  //  * 1.97; cool haze, latency, display effect
  currentScroll += (targetScroll - currentScroll) * 0.07; 
  update(currentScroll);
  requestAnimationFrame(animate);
}

function update(scroll) {
  items.forEach((item, i) => {

    // const angle = i * angleStep;
    const depthIndex = (-i * spacing + scroll) / spacing;
    const angle = depthIndex * angleStep;

    const x = -radius * Math.cos(angle);
    const y = radius * Math.sin(angle);

    // infinite depth wrapping
    let z = (-i * spacing + scroll);
    z = ((z % totalDepth) + totalDepth) % totalDepth;

    // center spiral around camera
    z -= totalDepth / 2;

    /* Depth window fade */
    const visibleRange = totalDepth / 2;
    let normalized = 1 - Math.abs(z) / visibleRange;
    normalized = Math.max(0, normalized);

    // 11 opacity for greater immersion
    const opacity = Math.pow(normalized, 1.6);
    // 11 scale really cool macro immersion
    const scale = 0.6 + normalized * 0.6;

    item.style.transform = `translate3d(${x}px, ${y}px, ${z}px) scale(${scale})`;
      // rotation..
  // item.style.transform =
  // `translate3d(${x}px, ${y}px, ${z}px)
  //  rotateZ(${angle * 0.01}rad)
  //  scale(${scale})`;

  const blur = (1 - normalized) * 8;
  item.style.filter = `blur(${blur}px)`;

  item.style.opacity = opacity;
    // item.style.backgroundrgba(255,255,255,0.05);
  });
}

/* ---------------------------
   SCROLL HANDLING
---------------------------- */

window.addEventListener("scroll", () => {
